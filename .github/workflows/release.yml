# Publishes to npm when a version tag (v0.1.0…) is pushed.
#
# The first release uses an npm access token saved as the NPM_TOKEN secret. After that, set up trusted publishing
# for this workflow on npmjs.com and delete the secret: npm then checks this workflow's identity instead of a token.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly runs the type check, the tests and the build.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
